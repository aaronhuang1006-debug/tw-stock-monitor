name: Daily TW stock scan

on:
  schedule:
    - cron: "0 10 * * 1-5"   # 10:00 UTC = 18:00 Asia/Taipei, Mon-Fri
    - cron: "30 12 * * 1-5"  # 12:30 UTC = 20:30 Asia/Taipei — backup trigger
  workflow_dispatch: {}

# GitHub starts scheduled runs hours late (observed: ~6h, i.e. after midnight Taipei time).
# src/main.py therefore never trusts the wall-clock date: it resolves the latest trading day
# that has data and skips if that day's report is already published, so late or duplicate
# triggers are harmless.

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Use CI settings template
        run: cp config/settings.ci.yaml config/settings.yaml

      - name: Restore stock database cache
        uses: actions/cache@v4
        with:
          path: data
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: Run daily scan
        env:
          TZ: Asia/Taipei
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m src.main ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Publish to GitHub Pages (docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "Update daily report ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
