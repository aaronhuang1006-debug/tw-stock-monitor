name: Daily TW stock scan

on:
  schedule:
    # Several triggers on off-peak minutes (GitHub delays :00/:30 schedules the most; runs triggered
    # at 17:30 Taipei were starting after 01:00). The first run that finds the day's data publishes;
    # the rest see it already published and stop in seconds.
    - cron: "43 6 * * 1-5"    # 14:43 Asia/Taipei (data may not be out yet; then it just skips)
    - cron: "17 7 * * 1-5"    # 15:17
    - cron: "47 7 * * 1-5"    # 15:47
    - cron: "47 8 * * 1-5"    # 16:47 Asia/Taipei
    - cron: "23 10 * * 1-5"   # 18:23
    - cron: "37 11 * * 1-5"   # 19:37
    - cron: "13 13 * * 1-5"   # 21:13
    - cron: "41 15 * * 1-5"   # 23:41 (fallback)
  workflow_dispatch:
    inputs:
      notify:
        description: "Send the Telegram message (turn off when re-running a day only to rebuild data/history)"
        type: boolean
        default: true

# GitHub starts scheduled runs hours late (observed: ~6h, i.e. after midnight Taipei time).
# src/main.py therefore never trusts the wall-clock date: it resolves the latest trading day
# that has data and skips if that day's report is already published, so late or duplicate
# triggers are harmless.

permissions:
  contents: write

# One scan at a time: a run that waited in the queue checks out after the previous one pushed,
# sees the day already published, and skips (no double Telegram message).
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Use CI settings template
        run: cp config/settings.ci.yaml config/settings.yaml

      - name: Restore stock database cache
        uses: actions/cache@v4
        with:
          path: data
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: Run daily scan
        env:
          TZ: Asia/Taipei
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m src.main ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.notify == false) && '--no-notify' || '' }}

      - name: Publish to GitHub Pages (docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "Update daily report ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
