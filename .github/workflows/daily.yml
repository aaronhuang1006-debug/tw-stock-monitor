name: Daily TW stock scan

on:
  schedule:
    - cron: "0 10 * * 1-5"   # 10:00 UTC = 18:00 Asia/Taipei, Mon-Fri
    - cron: "30 12 * * 1-5"  # 12:30 UTC = 20:30 Asia/Taipei — safety-net retry in case the
                             # first trigger was skipped/delayed by GitHub's own scheduler
                             # (a documented, occasional platform behavior, not under our control)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Use CI settings template
        run: cp config/settings.ci.yaml config/settings.yaml

      - name: Check whether today's report is already published
        id: check
        run: |
          TODAY=$(TZ=Asia/Taipei date +%Y-%m-%d)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if grep -q "\"date\": \"$TODAY\"" docs/index.html 2>/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already published for $TODAY — this is the safety-net trigger catching a normal day, skipping."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Not yet published for $TODAY — running (either the normal trigger, or a catch-up)."
          fi

      - name: Restore stock database cache
        if: steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: data
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: Run daily scan
        if: steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TZ: Asia/Taipei
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m src.main

      - name: Publish to GitHub Pages (docs/)
        if: steps.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "no changes to publish (likely a non-trading day)"
          else
            git commit -m "Update daily report ($(date -u +%Y-%m-%d))"
            git push
          fi
