name: Signal backtest

# Runs src/backtest.py against ~10 years of FinMind prices and commits the results to backtest/results/.
# It keeps its own price database (data/backtest.db, separate cache key), so the daily scan's data is untouched.
on:
  schedule:
    - cron: "17 18 1 * *"   # 1st of each month, 02:17 Asia/Taipei: refresh the 10-year backtest with the new month
  workflow_dispatch:
    inputs:
      start:
        description: "First date of price history"
        default: "2016-01-01"
      market:
        description: "tw (FinMind, Taiwan universe) or us (Yahoo, Nasdaq-100 + SOX)"
        type: choice
        options: [tw, us]
        default: tw
  push:
    branches: [main]
    paths:
      - "src/backtest.py"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # manual runs pick one market; the monthly schedule and pushes refresh both
        market: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.market)) || fromJSON('["tw","us"]') }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt yfinance lxml

      - name: Use CI settings template
        run: cp config/settings.ci.yaml config/settings.yaml

      - name: Restore backtest price cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.market == 'us' && 'data/backtest_us.db' || 'data/backtest.db' }}
          key: backtest-${{ matrix.market == 'us' && 'us-' || '' }}db-${{ github.run_id }}
          restore-keys: |
            backtest-${{ matrix.market == 'us' && 'us-' || '' }}db-

      - name: Run backtest
        env:
          TZ: Asia/Taipei
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m src.backtest --market ${{ matrix.market }} --start "${{ inputs.start || '2016-01-01' }}"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/results backtest/results_us
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Backtest results ${{ matrix.market }} ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
